<!DOCTYPE html>
<html lang="es">

<head>
  <!-- ===================== METADATOS ===================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Geraldine Herrera Rodríguez">
  <meta name="keywords" content="moda, tienda de ropa, moda femenina, moda masculina, moda infantil, cosméticos, accesorios">
  <meta name="description" content="Ashion es una tienda de moda en línea con colecciones para mujer, hombre y niños, además de cosméticos y accesorios.">
  <title>Ashion | Tienda de moda</title>
  <!-- ===================== FUENTES ===================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cookie&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- ===================== BOOTSTRAP ===================== -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- ===================== ESTILOS PROPIOS (BEM) ===================== -->
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>

  <!-- ===================== ENCABEZADO (bloque header) ===================== -->
  <header class="header">
    <nav class="navbar navbar-expand-lg header__navbar">
      <div class="container-fluid header__container">

        <!-- Logo -->
        <a class="navbar-brand header__logo order-1" href="index.html">Ashion</a>
        <!-- Acciones: cuenta, búsqueda, favoritos y carrito -->
        <div class="header__actions order-2 order-lg-3 ms-auto ms-lg-0">
          <a class="header__account d-none d-xl-inline" href="#">Login / Register</a>
          <a class="header__icon" href="#" aria-label="Buscar">
            <i class="bi bi-search"></i>
          </a>
          <a class="header__icon" href="#" aria-label="Favoritos">
            <i class="bi bi-heart"></i>
            <span class="header__badge">2</span>
          </a>
          <a class="header__icon" href="#" aria-label="Carrito">
            <i class="bi bi-bag"></i>
            <span class="header__badge">2</span>
          </a>
        </div>

        <!-- Botón del menú en celular y tablet -->
        <button class="navbar-toggler header__toggler order-3" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>


        <!-- Menú de navegación -->
        <div class="collapse navbar-collapse order-4 order-lg-2" id="menuPrincipal">
          <ul class="navbar-nav mx-auto header__menu">
            <li class="nav-item">
              <a class="nav-link header__link header__link--active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link header__link" href="#">Women&rsquo;s</a>
            </li>
            <li class="nav-item">
              <a class="nav-link header__link" href="#">Men&rsquo;s</a>
            </li>
            <li class="nav-item">
              <a class="nav-link header__link" href="#">Shop</a>
            </li>
            <li class="nav-item">
              <a class="nav-link header__link" href="#">Pages</a>
            </li>
            <li class="nav-item">
              <a class="nav-link header__link" href="#">Blog</a>
            </li>
            <li class="nav-item">
              <a class="nav-link header__link" href="#">Contact</a>
            </li>
          </ul>
        </div>

      </div>
    </nav>
  </header>
  <!-- ===================== SCRIPTS ===================== -->
  <!-- Bootstrap JS: necesario para abrir y cerrar el menú en celular -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
